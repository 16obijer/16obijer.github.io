<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrossQuant Project Button</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0a0a1a;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .btn {
            display: inline-block;
            padding: 16px 40px;
            background: #00d4ff;
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.3);
        }
    </style>
</head>
<body>
    <a href="https://github.com/16obijer/crossquant" class="btn" target="_blank">View CrossQuant Project →</a>
</body>
</html>
